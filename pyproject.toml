[project]
name = "python-anti-patterns"
version = "0.1.0"
description = "Presentation on Python Anti-Patterns for PyCon Italia 2026"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "marimo>=0.8.22",
    "matplotlib>=3.7.5",
    "pre-commit>=3.5.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle - style
    "F",         # pyflakes - correctness
    "B",         # bugbear - bugs & anti-patterns  ← high value
    "SIM",       # simplify - readability          ← high value
    "C4",        # comprehensions - readability     ← high value
    "PERF",      # perflint - performance           ← high value
    "A",         # builtins - reliability
    "N",         # naming - readability
    "PLE",       # pylint errors
    "PLW",       # pylint warnings
    "RUF",       # ruff-native rules
]

ignore = [
    "N807",
    "E501",
    "N807"
]
